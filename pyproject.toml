[project]
name = "landcheck"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "shapely>=2", "pyproj", "numpy", "xarray", "pyyaml",
  "pystac-client", "odc-stac",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "pydantic-settings>=2"]
flood = ["rasterio", "scikit-image", "lightgbm"]
ground = ["geopandas", "pandas"]
ingest = ["geopandas"]
landuse = ["lightgbm", "rasterio"]
# dev includes api so that `pip install -e ".[dev]" && pytest` also runs the API tests.
dev = ["landcheck[api]", "pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["landcheck*"]

[tool.setuptools.package-data]
"landcheck.api" = ["fixtures/**/*"]
